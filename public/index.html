<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دفتري</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <h1 class="brand" data-nav="home">دفتري</h1>
  <button id="exportBtn" class="btn secondary" title="Export CSV">Export</button>
</header>

<main id="app">

  <div class="hero">
    <h1 class="hero-title" data-nav="home">دفتري</h1>
    <div class="hero-row">
      <input id="searchInput" type="text" placeholder="Search…" autocomplete="off" dir="auto" />
      <button id="addBtn" class="btn primary">+ Add</button>
    </div>
  </div>

  <section id="homeView" class="view">
    <div class="section-block">
      <h2 class="section-title">Random words</h2>
      <div id="randomGrid" class="grid"></div>
    </div>
    <div class="section-block">
      <h2 class="section-title">Recently added</h2>
      <div id="recentGrid" class="grid"></div>
    </div>
  </section>

  <section id="resultsView" class="view hidden">
    <h2 id="resultsTitle" class="section-title"></h2>
    <div id="resultsGrid" class="grid"></div>
  </section>

</main>

<!-- Card detail / edit modal -->
<div id="cardModal" class="modal-overlay hidden">
  <div class="modal card-modal">
    <button class="modal-close" data-close-card>&times;</button>
    <div id="cardModalBody"></div>
  </div>
</div>

<!-- Add word modal -->
<div id="addModal" class="modal-overlay hidden">
  <div class="modal add-modal">
    <button class="modal-close" data-close-add>&times;</button>
    <div id="addModalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
